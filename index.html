<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0D1117">
  <title>LifeOS — Sistema Pessoal</title>
  <style>
    :root, [data-theme="dark"] {
      --bg-base: #0D1117;
      --bg-surface: #161B22;
      --bg-elevated: #1F2630;
      --border: #2B3440;
      --text-primary: #F5F7FA;
      --text-secondary: #929BA6;
      --text-muted: #68727E;
      --accent: #8BE0A3;
      --accent-fg: #08180E;
      --accent-soft: rgba(139, 224, 163, 0.14);
      --danger: #F26D6D;
      --danger-soft: rgba(242, 109, 109, 0.14);
      --warning: #F2C96D;
      --info: #6DB3F2;
      --purple: #B58BF2;
      --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
    [data-theme="oled"] {
      --bg-base: #000000;
      --bg-surface: #0A0C10;
      --bg-elevated: #141820;
      --border: #222832;
      --text-primary: #FFFFFF;
      --text-secondary: #8E97A4;
      --text-muted: #5C6572;
    }
    [data-theme="light"] {
      --bg-base: #F3F5F8;
      --bg-surface: #FFFFFF;
      --bg-elevated: #E9EDF2;
      --border: #D5DCE4;
      --text-primary: #11161D;
      --text-secondary: #535E6B;
      --text-muted: #7C8794;
      --accent: #189E52;
      --accent-fg: #FFFFFF;
      --accent-soft: rgba(24, 158, 82, 0.12);
      --danger: #D93838;
      --danger-soft: rgba(217, 56, 56, 0.12);
      --warning: #C98A14;
      --info: #2574C4;
      --purple: #7B49C9;
      --shadow: 0 8px 22px rgba(17, 22, 29, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      overflow-x: hidden;
    }
    .hidden { display: none !important; }
    .mono { font-variant-numeric: tabular-nums; }
    .text-secondary { color: var(--text-secondary); }
    .text-muted { color: var(--text-muted); }
    .text-accent { color: var(--accent); }
    .text-danger { color: var(--danger); }

    .app-header {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
      background: var(--bg-base);
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      border: 1px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 15px;
    }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-subtitle { font-size: 12px; color: var(--text-secondary); text-transform: capitalize; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .icon-btn {
      position: relative; width: 34px; height: 34px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-surface);
      color: var(--text-primary); font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .notif-badge {
      position: absolute; top: -4px; right: -4px;
      background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
      min-width: 16px; height: 16px; border-radius: 99px; padding: 0 4px;
      display: flex; align-items: center; justify-content: center;
    }

    .sub-nav {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px;
      background: var(--bg-base); border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .sub-nav::-webkit-scrollbar { display: none; }
    .sub-tab {
      border: 1px solid var(--border); background: var(--bg-surface);
      color: var(--text-secondary); padding: 6px 12px; border-radius: 99px;
      font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
    }
    .sub-tab.active {
      background: var(--accent); color: var(--accent-fg); border-color: var(--accent);
    }

    .main-content {
      max-width: 680px; margin: 0 auto;
      padding: 14px 16px calc(96px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 14px;
    }
    .section-heading {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .section-heading h2 { font-size: 20px; font-weight: 700; }

    .card {
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; box-shadow: var(--shadow);
    }
    .card-subtle {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 12px;
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; gap: 8px;
    }
    .card-title { font-size: 15px; font-weight: 700; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-gap-sm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-list { display: flex; flex-direction: column; gap: 10px; }

    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi-grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    @media (min-width: 480px) { .kpi-grid-4 { grid-template-columns: repeat(4, 1fr); } }
    .kpi-box {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px;
    }
    .kpi-label { font-size: 11.5px; color: var(--text-secondary); }
    .kpi-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi-sub { font-size: 11px; color: var(--text-muted); }

    .progress-track {
      width: 100%; height: 7px; border-radius: 99px;
      background: var(--bg-elevated); overflow: hidden;
    }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width 0.25s; }
    .progress-fill.danger { background: var(--danger); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600;
      background: var(--bg-elevated); color: var(--text-secondary); border: 1px solid var(--border);
    }
    .badge-accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .badge-info { background: rgba(109, 179, 242, 0.16); color: var(--info); border-color: transparent; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600;
      border: 1px solid transparent; cursor: pointer;
    }
    .btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 10px; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-secondary { background: var(--bg-elevated); color: var(--text-primary); border-color: var(--border); }
    .btn-danger-soft { background: var(--danger-soft); color: var(--danger); border-color: rgba(242,109,109,0.3); }
    .icon-btn-sm {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-elevated);
      color: var(--text-secondary); font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }

    .form-stack { display: flex; flex-direction: column; gap: 11px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
    .input {
      width: 100%; padding: 10px 12px; border-radius: 11px;
      border: 1px solid var(--border); background: var(--bg-elevated);
      color: var(--text-primary); font-size: 14px; font-family: inherit;
    }
    textarea.input { min-height: 76px; resize: vertical; }
    .checkbox-card {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      border-radius: 11px; background: var(--bg-elevated); border: 1px solid var(--border);
      font-size: 13px; cursor: pointer;
    }

    .chip-row { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      padding: 5px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border); background: var(--bg-surface);
      color: var(--text-secondary); white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

    .list-item {
      display: flex; align-items: flex-start; gap: 10px;
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px;
    }
    .list-item.completed { opacity: 0.65; }
    .check-circle {
      width: 24px; height: 24px; min-width: 24px; border-radius: 50%;
      border: 2px solid var(--border); background: transparent;
      color: var(--accent-fg); font-weight: 700; font-size: 13px;
      display: flex; align-items: center; justify-content: center; cursor: pointer; margin-top: 2px;
    }
    .check-circle.checked { background: var(--accent); border-color: var(--accent); }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal-weekday { font-size: 11px; font-weight: 600; color: var(--text-muted); padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1; border-radius: 10px; border: 1px solid transparent;
      background: var(--bg-elevated); color: var(--text-primary); font-size: 13px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; cursor: pointer;
    }
    .cal-day.other-month { background: transparent; pointer-events: none; }
    .cal-day.today { border-color: var(--accent); color: var(--accent); font-weight: 700; }
    .cal-day.selected { background: var(--accent); color: var(--accent-fg); font-weight: 700; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }

    .heatmap-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    .heat-cell {
      aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text-muted); font-size: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .heat-cell.partial { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
    .heat-cell.done { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }

    .timeline { display: flex; flex-direction: column; gap: 8px; }
    .timeline-item { display: flex; gap: 10px; align-items: stretch; }
    .timeline-time { width: 46px; font-size: 12px; font-weight: 700; color: var(--accent); text-align: right; padding-top: 8px; }
    .timeline-card { flex: 1; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; }

    .chart-canvas { width: 100%; height: 155px; display: block; }
    .empty-state { text-align: center; padding: 20px 12px; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      display: grid; grid-template-columns: repeat(5, 1fr);
      background: var(--bg-surface); border-top: 1px solid var(--border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-item {
      background: none; border: none; color: var(--text-secondary);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 0;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 18px; line-height: 1.1; }

    .fab {
      position: fixed; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom)); z-index: 28;
      width: 50px; height: 50px; border-radius: 50%; border: none;
      background: var(--accent); color: var(--accent-fg);
      font-size: 26px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer;
    }

    .onboarding-overlay, .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0, 0, 0, 0.72);
      display: flex; align-items: flex-end; justify-content: center;
      padding: 16px;
    }
    .onboarding-overlay { align-items: center; background: var(--bg-base); }
    .onboarding-card, .modal-sheet {
      width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
      background: var(--bg-surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 18px; box-shadow: var(--shadow);
    }
    .onboarding-logo { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
    .onboarding-card h1 { font-size: 22px; margin-bottom: 6px; }
    .onboarding-card p { margin-bottom: 14px; }
    .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .quick-btn {
      padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg-elevated); color: var(--text-primary);
      font-size: 13.5px; font-weight: 600; text-align: left; cursor: pointer;
    }

    .toast-container {
      position: fixed; top: calc(64px + env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
    }
    .toast {
      background: var(--bg-elevated); color: var(--text-primary);
      border: 1px solid var(--accent); padding: 8px 14px; border-radius: 99px;
      font-size: 13px; font-weight: 600; box-shadow: var(--shadow);
    }
    .toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>
  <div id="onboarding-screen" class="onboarding-overlay hidden">
    <div class="onboarding-card">
      <div class="onboarding-logo">✦ LifeOS</div>
      <h1>Bem-vindo ao LifeOS</h1>
      <p class="text-secondary">Seu sistema pessoal offline para tarefas, hábitos, finanças, metas e projetos.</p>
      <form id="onboarding-form" class="form-stack">
        <div class="form-group">
          <label for="ob-name">Como deseja ser chamado? *</label>
          <input type="text" id="ob-name" class="input" placeholder="Seu nome" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="ob-currency">Moeda</label>
            <select id="ob-currency" class="input">
              <option value="BRL" selected>Real (R$)</option>
              <option value="USD">Dólar (US$)</option>
              <option value="EUR">Euro (€)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="ob-theme">Tema</label>
            <select id="ob-theme" class="input">
              <option value="dark" selected>Dark Premium</option>
              <option value="oled">OLED Puro</option>
              <option value="light">Claro</option>
            </select>
          </div>
        </div>
        <label class="checkbox-card">
          <input type="checkbox" id="ob-demo" checked>
          <span>Adicionar exemplos para explorar</span>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Começar a usar</button>
      </form>
    </div>
  </div>

  <header class="app-header">
    <div class="header-left" id="header-profile-trigger" style="cursor:pointer;">
      <div id="header-avatar" class="avatar">L</div>
      <div>
        <div id="header-greeting" class="header-title">Olá, Usuário</div>
        <div id="header-date" class="header-subtitle">Hoje</div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" id="btn-global-search" class="icon-btn" aria-label="Buscar">🔍</button>
      <button type="button" id="btn-notifications" class="icon-btn" aria-label="Alertas">
        🔔<span id="notif-badge" class="notif-badge hidden">0</span>
      </button>
      <button type="button" id="btn-settings" class="icon-btn" aria-label="Configurações">⚙️</button>
    </div>
  </header>

  <nav id="sub-nav" class="sub-nav hidden"></nav>
  <main id="main-content" class="main-content"></main>

  <button type="button" id="fab-quick-capture" class="fab" aria-label="Novo">+</button>

  <nav id="bottom-nav" class="bottom-nav">
    <button type="button" class="nav-item active" data-section="dashboard"><span class="nav-icon">⌂</span><span>Início</span></button>
    <button type="button" class="nav-item" data-section="planning"><span class="nav-icon">☑</span><span>Rotina</span></button>
    <button type="button" class="nav-item" data-section="finance"><span class="nav-icon">◈</span><span>Finanças</span></button>
    <button type="button" class="nav-item" data-section="goals"><span class="nav-icon">◎</span><span>Metas</span></button>
    <button type="button" class="nav-item" data-section="library"><span class="nav-icon">▤</span><span>Base</span></button>
  </nav>

  <div id="quick-capture-backdrop" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Captura Rápida</h3>
        <button type="button" id="close-quick-capture" class="icon-btn-sm">✕</button>
      </div>
      <div class="quick-grid">
        <button type="button" class="quick-btn" data-quick="task">☑ Nova Tarefa</button>
        <button type="button" class="quick-btn" data-quick="event">📅 Compromisso</button>
        <button type="button" class="quick-btn" data-quick="expense">− Despesa</button>
        <button type="button" class="quick-btn" data-quick="income">+ Receita</button>
        <button type="button" class="quick-btn" data-quick="note">✎ Nova Nota</button>
        <button type="button" class="quick-btn" data-quick="goal">◎ Novo Objetivo</button>
      </div>
    </div>
  </div>

  <div id="search-overlay" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Busca Global</h3>
        <button type="button" id="close-global-search" class="icon-btn-sm">✕</button>
      </div>
      <input type="search" id="global-search-input" class="input" placeholder="Pesquisar no sistema...">
      <div id="global-search-results" class="item-list" style="margin-top:12px;"></div>
    </div>
  </div>

  <div id="notifications-overlay" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3>Alertas</h3>
        <button type="button" id="close-notifications" class="icon-btn-sm">✕</button>
      </div>
      <div id="notifications-list"></div>
    </div>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button type="button" id="close-modal" class="icon-btn-sm">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="confirm-backdrop" class="modal-backdrop hidden">
    <div class="modal-sheet">
      <div class="modal-header"><h3 id="confirm-title">Confirmar</h3></div>
      <p id="confirm-message" class="text-secondary" style="margin-bottom:14px;"></p>
      <div class="form-row">
        <button type="button" id="confirm-cancel" class="btn btn-secondary">Cancelar</button>
        <button type="button" id="confirm-ok" class="btn btn-primary">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script>
    (function () {
      const DB_NAME = 'LifeOS_Solo_DB';
      const STORES = ['tasks', 'events', 'habits', 'habitLogs', 'accounts', 'cards', 'transactions', 'budgets', 'goals', 'notes', 'projects'];
      const PREFS_KEY = 'lifeos_solo_prefs_v1';
      let db = null;

      const Prefs = {
        getAll() {
          try {
            return { userName: '', currency: 'BRL', theme: 'dark', weekStart: 0, onboarded: false, ...JSON.parse(localStorage.getItem(PREFS_KEY) || '{}') };
          } catch { return { userName: '', currency: 'BRL', theme: 'dark', weekStart: 0, onboarded: false }; }
        },
        get(k) { return this.getAll()[k]; },
        set(k, v) { const n = { ...this.getAll(), [k]: v }; localStorage.setItem(PREFS_KEY, JSON.stringify(n)); return n; },
        reset() { localStorage.removeItem(PREFS_KEY); }
      };

      const DB = {
        init() {
          if (db) return Promise.resolve(db);
          return new Promise((res, rej) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => {
              const d = e.target.result;
              STORES.forEach((s) => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
            };
            req.onsuccess = () => { db = req.result; res(db); };
            req.onerror = () => rej(req.error);
          });
        },
        async getAll(store) {
          const d = await this.init();
          return new Promise((res, rej) => {
            const r = d.transaction(store, 'readonly').objectStore(store).getAll();
            r.onsuccess = () => res(r.result || []);
            r.onerror = () => rej(r.error);
          });
        },
        async get(store, id) {
          const d = await this.init();
          return new Promise((res, rej) => {
            const r = d.transaction(store, 'readonly').objectStore(store).get(id);
            r.onsuccess = () => res(r.result || null);
            r.onerror = () => rej(r.error);
          });
        },
        async put(store, item) {
          const d = await this.init();
          return new Promise((res, rej) => {
            const r = d.transaction(store, 'readwrite').objectStore(store).put(item);
            r.onsuccess = () => res(item);
            r.onerror = () => rej(r.error);
          });
        },

      const Utils = {
        todayISO() {
          const d = new Date();
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        },
        addDays(iso, days) {
          const [y, m, d] = (iso || this.todayISO()).split('-').map(Number);
          const dt = new Date(y, m - 1, d + Number(days || 0));
          return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
        },
        uid(p = 'id') { return `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 6)}`; },
        esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); },
        money(v) {
          const cur = Prefs.get('currency') || 'BRL';
          const loc = cur === 'BRL' ? 'pt-BR' : cur === 'EUR' ? 'de-DE' : 'en-US';
          return new Intl.NumberFormat(loc, { style: 'currency', currency: cur }).format(Number(v) || 0);
        },
        dateBR(iso) {
          if (!iso) return '—';
          const p = String(iso).slice(0, 10).split('-');
          return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : iso;
        },
        donut(canvas, items) {
          if (!canvas) return;
          const dpr = window.devicePixelRatio || 1;
          const w = Math.max(260, canvas.getBoundingClientRect().width || 300);
          const h = 150;
          canvas.width = w * dpr; canvas.height = h * dpr;
          const ctx = canvas.getContext('2d');
          ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);
          const total = items.reduce((s, i) => s + i.value, 0);
          if (!total) {
            ctx.fillStyle = '#929BA6'; ctx.font = '13px -apple-system, sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('Sem despesas no período', w / 2, h / 2); return;
          }
          const cols = ['#8BE0A3', '#6DB3F2', '#F2C96D', '#B58BF2', '#F26D6D'];
          const cx = 74, cy = h / 2, r = 56;
          let ang = -Math.PI / 2;
          items.slice(0, 5).forEach((it, i) => {
            const sl = (it.value / total) * Math.PI * 2;
            ctx.beginPath(); ctx.arc(cx, cy, r, ang, ang + sl); ctx.arc(cx, cy, r * 0.56, ang + sl, ang, true);
            ctx.closePath(); ctx.fillStyle = cols[i % cols.length]; ctx.fill(); ang += sl;
          });
          items.slice(0, 5).forEach((it, i) => {
            const y = 26 + i * 24;
            ctx.fillStyle = cols[i % cols.length]; ctx.fillRect(150, y - 9, 10, 10);
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim() || '#F5F7FA';
            ctx.font = '12px -apple-system, sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(`${it.label.slice(0, 14)} (${Math.round((it.value / total) * 100)}%)`, 166, y);
          });
        }

          } else if (tab === 'accounts') {

          } else {
            el.innerHTML = `

                  <div class="row-between" style="margin-bottom:6px;"><strong>${Utils.esc(b.category)}</strong><button type="button" class="icon-btn-sm" data-db="${b.id}">🗑</button></div>

      const App = {
        async init() {
          try {
            await DB.init();
            this.refreshHeader();
            this.bind();
            if (!Prefs.get('onboarded')) document.getElementById('onboarding-screen').classList.remove('hidden');
            else UI.go('dashboard');
          } catch (err) {
            document.getElementById('main-content').innerHTML = `<div class="card"><p class="text-danger">Erro ao iniciar: ${Utils.esc(err && err.message || err)}</p></div>`;
          }
        },
        refreshHeader() {
          const p = Prefs.getAll();
          document.documentElement.setAttribute('data-theme', p.theme || 'dark');
          const name = p.userName || 'Usuário';
          document.getElementById('header-greeting').textContent = `Olá, ${name}`;
          document.getElementById('header-avatar').textContent = name.charAt(0).toUpperCase();
          document.getElementById('header-date').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' });
        },
        bind() {
          document.getElementById('onboarding-form').onsubmit = async (e) => {
            e.preventDefault();
            Prefs.set('userName', document.getElementById('ob-name').value.trim());
            Prefs.set('currency', document.getElementById('ob-currency').value);
            Prefs.set('theme', document.getElementById('ob-theme').value);
            Prefs.set('onboarded', true);
            if (document.getElementById('ob-demo').checked) await DB.seedDemo();
            document.getElementById('onboarding-screen').classList.add('hidden');
            this.refreshHeader();
            UI.go('dashboard');
          };
          document.querySelectorAll('#bottom-nav .nav-item').forEach((b) => b.onclick = () => UI.go(b.dataset.section));
          document.getElementById('btn-settings').onclick = () => UI.go('settings');
          document.getElementById('header-profile-trigger').onclick = () => UI.go('settings');
          document.getElementById('close-modal').onclick = () => UI.closeModal();

          const qc = document.getElementById('quick-capture-backdrop');
          document.getElementById('fab-quick-capture').onclick = () => qc.classList.remove('hidden');
          document.getElementById('close-quick-capture').onclick = () => qc.classList.add('hidden');
          document.querySelectorAll('[data-quick]').forEach((b) => b.onclick = () => {
            qc.classList.add('hidden');
            const q = b.dataset.quick;
            if (q === 'task') Forms.task();
            else if (q === 'event') Forms.event();
            else if (q === 'expense') Forms.tx('expense');
            else if (q === 'income') Forms.tx('income');
            else if (q === 'note') Forms.note();
            else if (q === 'goal') Forms.goal();
          });

          const so = document.getElementById('search-overlay'), si = document.getElementById('global-search-input');
          document.getElementById('btn-global-search').onclick = () => { so.classList.remove('hidden'); si.value = ''; document.getElementById('global-search-results').innerHTML = ''; };
          document.getElementById('close-global-search').onclick = () => so.classList.add('hidden');
          si.oninput = async () => {
            const q = si.value.trim().toLowerCase(), res = document.getElementById('global-search-results');
            if (!q) { res.innerHTML = ''; return; }
            const [tasks, notes, txs] = await Promise.all([DB.getAll('tasks'), DB.getAll('notes'), DB.getAll('transactions')]);
            const hits = [
              ...tasks.filter((t) => (t.title||'').toLowerCase().includes(q)).map((t) => ({ tag: 'Tarefa', title: t.title, go: 'planning:tasks' })),
              ...notes.filter((n) => (n.title||'').toLowerCase().includes(q)).map((n) => ({ tag: 'Nota', title: n.title, go: 'library:notes' })),
              ...txs.filter((t) => (t.description||'').toLowerCase().includes(q)).map((t) => ({ tag: 'Finanças', title: t.description, go: 'finance:transactions' }))
            ];
            res.innerHTML = hits.length ? hits.map((h) => `<div class="card-subtle row-between" data-sgo="${h.go}"><strong>${Utils.esc(h.title)}</strong><span class="badge">${h.tag}</span></div>`).join('') : '<p class="text-secondary">Nada encontrado.</p>';
            res.querySelectorAll('[data-sgo]').forEach((x) => x.onclick = () => { so.classList.add('hidden'); const [a, b] = x.dataset.sgo.split(':'); UI.go(a, b); });
          };

          const no = document.getElementById('notifications-overlay');
          document.getElementById('btn-notifications').onclick = async () => {
            const tasks = await DB.getAll('tasks'), today = Utils.todayISO();
            const late = tasks.filter((t) => !t.completed && t.dueDate && t.dueDate < today);
            document.getElementById('notifications-list').innerHTML = late.length
              ? `<div class="item-list">${late.map((t) => `<div class="card-subtle"><strong>Atrasada: ${Utils.esc(t.title)}</strong></div>`).join('')}</div>`
              : '<p class="text-secondary">Nenhum alerta pendente.</p>';
            no.classList.remove('hidden');
          };
          document.getElementById('close-notifications').onclick = () => no.classList.add('hidden');
        }
      };

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => App.init());
      else App.init();
    })();
  </script>
</body>
</html>
